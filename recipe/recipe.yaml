schema_version: 1

context:
  name: fmodpy
  version: "1.7.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fmodpy-${{ version }}.tar.gz
  sha256: f8dcbb99e8207f64e3a74c88c9ee3c0109d991d82eea2bb96b4f3208157e7baf

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.13

tests:
  - python:
      imports:
        - fmodpy
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: A lightweight, efficient, highly automated, fortran wrapper for python.
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/tchlux/fmodpy

extra:
  recipe-maintainers:
    - synapticarbors
